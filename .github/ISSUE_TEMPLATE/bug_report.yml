name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a webhook, private portal URL, real task data, raw API response, or secret.
        Security vulnerabilities belong in GitHub Private Vulnerability Reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin commit/version, Iva version, Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps and sanitized output using example domains and invented data
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed webhook values, portal identifiers, personal data and real task content.
          required: true
